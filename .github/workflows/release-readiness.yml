name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build Windows release candidate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repository hygiene
        shell: pwsh
        run: |
          $blocked = git ls-files | Where-Object {
            $_ -match '(^|/)(node_modules|dist|logs|diagnostics|crash-reports)/' -or
            $_ -match '(^|/)\.env($|\.)' -or
            $_ -match '\.(pfx|p12|pem|key)$'
          }
          if ($blocked) {
            $blocked | ForEach-Object { Write-Error "Blocked release file tracked: $_" }
            exit 1
          }

      - name: Scan Git history for credential patterns
        shell: pwsh
        run: |
          $history = git log -p --all --no-color
          $patterns = @(
            'github_pat_[A-Za-z0-9_]{60,}',
            'gh[pousr]_[A-Za-z0-9]{30,}',
            'sk-(?:proj-)?[A-Za-z0-9_-]{30,}',
            'AIza[0-9A-Za-z_-]{30,}',
            '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
          )
          foreach ($pattern in $patterns) {
            if ([regex]::IsMatch($history, $pattern)) {
              throw "Potential credential/private-key material was found in Git history. Review history before release."
            }
          }

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js

      - name: Validate package metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.0') { throw "Expected package version 2.1.0, found $($pkg.version)" }
          if ($pkg.main -ne 'src/main.js') { throw "Unexpected Electron main entry: $($pkg.main)" }
          if ($pkg.devDependencies.electron -ne '44.2.0') { throw "Electron pin changed unexpectedly." }
          if ($pkg.private -ne $true) { throw "package.json private must remain true to prevent accidental npm publication." }

      - name: Verify committed dependency locks
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "Committed root package-lock.json is missing." }
          if (-not (Test-Path runtime/package-lock.json)) { throw "Committed runtime/package-lock.json is missing." }

          $root = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $runtime = Get-Content runtime/package-lock.json -Raw | ConvertFrom-Json -AsHashtable

          if ($root.lockfileVersion -ne 3) { throw "Root lockfileVersion must be 3." }
          if ($root.version -ne '2.1.0') { throw "Root lock version must be 2.1.0." }
          if ($root.packages[''].devDependencies.electron -ne '44.2.0') { throw "Root Electron lock is not 44.2.0." }

          if ($runtime.lockfileVersion -ne 3) { throw "Runtime lockfileVersion must be 3." }
          if ($runtime.version -ne '1.6.4') { throw "Runtime lock version must be 1.6.4." }
          if ($runtime.packages[''].dependencies.electron -ne '44.2.0') { throw "Runtime Electron lock is not 44.2.0." }
          if ($runtime.packages.ContainsKey('..')) { throw "Runtime lock contains an unintended parent-package entry." }
          if ($runtime.packages.Keys | Where-Object { $_ -match 'purple-dragon-powertools' -and $_ -ne '' }) {
            throw "Runtime lock contains an unintended local PowerTools link."
          }

      - name: Install packaging dependencies from committed lock
        run: npm ci --no-audit --no-fund

      - name: Validate runtime lock installation
        shell: pwsh
        run: |
          Push-Location runtime
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Dependency audit
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location runtime
          try {
            npm audit --omit=dev --audit-level=high
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Build NSIS installer and portable executable
        run: npm run dist:win -- --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem dist -File -Filter '*.exe')
          if ($executables.Count -lt 2) { throw "Expected separate NSIS installer and portable executables; found $($executables.Count)." }
          if (-not ($executables.Name -match 'Setup')) { throw "NSIS Setup executable is missing." }
          if (-not ($executables.Name -match 'Portable')) { throw "Portable executable is missing." }

          $artifacts = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.msi','.zip' }
          if (-not $artifacts) { throw "No publishable Windows artifacts were produced." }

          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Dragon-PowerTools-v2.1.0-Release-Candidate
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
